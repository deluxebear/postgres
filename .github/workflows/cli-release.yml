# Adapted from supabase/postgres CLI Release at v17.12.0.005-cli.
# Keep the upstream native build -> no-Nix test -> publish structure.
name: CLI Release with custom extensions

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Optional stable PG17 CLI release tag; empty tracks the latest"
        type: string
        default: ""
      publish:
        description: "Publish after all three platforms pass (false always builds for validation)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: custom-cli-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover stable releases and prepare source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has_work: ${{ steps.discover.outputs.has_work }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: .workflow
          persist-credentials: false
      - name: Validate release automation
        working-directory: .workflow
        run: |
          python3 -m unittest discover -s tests -p test_portable_release.py
          shellcheck scripts/portable/test.sh
          bash -n scripts/portable/test.sh
      - name: Discover latest stable upstream and extension releases
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
          BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: |
          set -euo pipefail
          args=(--repository "$GH_REPO" --output discovery.json)
          if [[ -n "$UPSTREAM_REF" ]]; then args+=(--upstream-ref "$UPSTREAM_REF"); fi
          if [[ "$BUILD_ONLY" == true ]]; then args+=(--force); fi
          python3 .workflow/scripts/portable/release.py discover "${args[@]}"
          if [[ $(jq -r .has_work discovery.json) == true ]]; then
            echo "upstream_sha=$(jq -r .upstream.commit discovery.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'No new stable PG17 CLI release requires publishing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout exact upstream release source
        if: steps.discover.outputs.has_work == 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: supabase/postgres
          ref: ${{ steps.discover.outputs.upstream_sha }}
          path: upstream
          persist-credentials: false
      - name: Pin sources and add custom extensions to upstream portable build
        if: steps.discover.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .workflow/scripts/portable/release.py prepare \
            --plan discovery.json --checkout upstream --output prepared
          jq '{upstream, extensions, source_commit}' prepared/plan.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload immutable prepared source
        if: steps.discover.outputs.has_work == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-source
          path: prepared/
          if-no-files-found: error
          retention-days: 30

  build-native:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-15
            arch: darwin-arm64
          - system: x86_64-linux
            runner: ubuntu-24.04
            arch: linux-x64
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            arch: linux-arm64
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: .workflow
          persist-credentials: false
      - name: Download prepared source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-source
          path: prepared
      - name: Extract exact build source
        run: |
          mkdir upstream
          tar -xzf prepared/source.tar.gz -C upstream
          # Flakes in a non-git directory include the resolved pins and manifest.
      - name: Install Nix
        uses: ./.workflow/.github/actions/nix-install-ephemeral
      - name: Build portable CLI bundle
        uses: ./.workflow/.github/actions/nix-build-retry
        with:
          attr: path:./upstream#psql_17_cli_portable
          extra-args: --system ${{ matrix.system }}
      - name: Run upstream portability check
        uses: ./.workflow/.github/actions/nix-build-retry
        with:
          attr: path:./upstream#checks.${{ matrix.system }}.psql_17_cli_portable
          extra-args: --no-link --system ${{ matrix.system }}
      - name: Package bundle and actual extension versions
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tag=$(jq -r .release_tag prepared/plan.json)
          name="supabase-${tag}-${ARCH}"
          mkdir -p "staging/$name" dist
          cp -RL result/. "staging/$name/"
          chmod -R u+w "staging/$name"
          python3 upstream/scripts/portable/inventory.py "staging/$name" "$ARCH"
          cp "staging/$name/extensions.json" "dist/$name.extensions.json"
          tar -czf "dist/$name.tar.gz" -C staging "$name"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-binary-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test-portability:
    name: Test ${{ matrix.arch }} without Nix
    needs: build-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: darwin-arm64
          - runner: ubuntu-24.04
            arch: linux-x64
          - runner: ubuntu-24.04-arm
            arch: linux-arm64
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Download portable archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-binary-${{ matrix.arch }}
          path: dist
      - name: Verify checksum and relocate bundle
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum -c ./*.tar.gz.sha256
          else
            shasum -a 256 -c ./*.tar.gz.sha256
          fi
          mkdir ../relocated
          tar -xzf ./*.tar.gz -C ../relocated
      - name: Validate extension installation, execution, upgrade, restart and restore
        run: bash scripts/portable/test.sh relocated/*

  publish:
    name: Publish portable GitHub release
    needs: [prepare, test-portability]
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Download prepared source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portable-source
          path: prepared
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portable-binary-*
          merge-multiple: true
          path: artifacts
      - name: Validate inventories and generate release notes
        run: |
          python3 scripts/portable/release.py notes --plan prepared/plan.json \
            --artifacts artifacts --output release-notes.md
          cd artifacts
          sha256sum -c ./*.tar.gz.sha256
      - name: Push immutable source tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(jq -r .release_tag prepared/plan.json)
          source_sha=$(jq -r .source_commit prepared/plan.json)
          git fetch prepared/source.bundle refs/heads/portable-source
          test "$(git rev-parse FETCH_HEAD)" = "$source_sha"
          git diff --exit-code "$GITHUB_SHA" "$source_sha" -- .github/workflows
          # Never rewrite an existing tag or a completed release.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > existing-tag.json 2> tag-error.log; then
            test "$(jq -r .object.sha existing-tag.json)" = "$source_sha"
          elif ! grep -q 'HTTP 404' tag-error.log; then
            cat tag-error.log >&2; exit 1
          else
            gh auth setup-git --hostname github.com
            git push "https://github.com/$GH_REPO.git" "$source_sha:refs/tags/$tag"
          fi
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2> release-error.log; then
            test "$(cat draft.txt)" = true
            gh release edit "$tag" --notes-file release-notes.md
          elif grep -qi 'release not found' release-error.log; then
            gh release create "$tag" --verify-tag --draft --latest=false \
              --title "PostgreSQL ${tag#postgres-} portable" --notes-file release-notes.md
          else
            cat release-error.log >&2; exit 1
          fi
          gh release upload "$tag" artifacts/*.tar.gz artifacts/*.sha256 artifacts/*.extensions.json --clobber
          gh release edit "$tag" --draft=false --latest=false
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
