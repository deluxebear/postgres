name: Build Upstream PG17 Release with custom extensions

on:
  push:
    branches:
      - custom-extensions
  workflow_dispatch:
    inputs:
      build_docker:
        description: "Build and push matching Docker images, then publish a GitHub release"
        required: false
        default: true
        type: boolean
      upstream_ref:
        description: "Optional exact Supabase PG17 release tag to rebuild (for example 17.6.1.166)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "20 2 * * *"

permissions:
  actions: write
  contents: write

jobs:
  discover:
    name: Discover upstream PG17 releases
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      has_work: ${{ steps.releases.outputs.has_work }}
    steps:
      - name: Select latest non-test PG17 releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_UPSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || '' }}
        run: |
          set -euo pipefail

          releases_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/supabase/postgres/releases?per_page=100")"

          selected_matrix="$(jq -c --arg requested_ref "$REQUESTED_UPSTREAM_REF" '
            def release_text: ((.tag_name // "") + " " + (.name // ""));
            def stable: (.draft | not) and (.prerelease | not);
            def no_test: (release_text | test("test"; "i") | not);
            def server_pg17: (.tag_name | test("^v?17[.][0-9]+[.][0-9]+[.][0-9]+$"));
            def server_orioledb17: (.tag_name | test("^v?17[.][0-9]+[.][0-9]+[.][0-9]+-orioledb$"));
            def matrix_item:
              if . == null then empty
              elif server_pg17 then {
                flavor: "17",
                upstream_ref: .tag_name,
                release_name: .name,
                package_attr: ".#psql_17/bin",
                dockerfile: "Dockerfile-17",
                docker_target: ""
              }
              elif server_orioledb17 then {
                flavor: "orioledb-17",
                upstream_ref: .tag_name,
                release_name: .name,
                package_attr: ".#psql_orioledb-17/bin",
                dockerfile: "Dockerfile-orioledb-17",
                docker_target: ""
              }
              else empty
              end;

            if $requested_ref != "" then
              {
                include: [
                  .[]
                  | select(.tag_name == $requested_ref)
                  | select(stable and no_test)
                  | matrix_item
                ]
              }
            else
              {
                include: [
                  ([.[] | select(stable and no_test and server_pg17)][0] | matrix_item),
                  ([.[] | select(stable and no_test and server_orioledb17)][0] | matrix_item)
                ]
                | map(select(.upstream_ref != null))
              }
            end
          ' <<< "$releases_json")"

          if [ "$(jq '.include | length' <<< "$selected_matrix")" -eq 0 ]; then
            if [ -n "$REQUESTED_UPSTREAM_REF" ]; then
              echo "Requested stable upstream PG17 release not found: $REQUESTED_UPSTREAM_REF" >&2
            else
              echo "No matching upstream PG17 releases found" >&2
            fi
            exit 1
          fi

          echo "Selected releases:"
          jq -r '.include[] | "- \(.flavor): \(.upstream_ref) (\(.release_name))"' <<< "$selected_matrix"

          matrix='{"include":[]}'
          while IFS= read -r item; do
            upstream_ref="$(jq -r '.upstream_ref' <<< "$item")"

            # Repository updates and manual runs always rebuild the latest
            # matching upstream releases. Only scheduled runs are no-ops when
            # this repository has already published the corresponding release.
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              version_tag="${upstream_ref#v}"
              source_tag="postgres-${version_tag}"

              release_status="$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${source_tag}")"

              if [ "$release_status" = "200" ]; then
                echo "Already released ${source_tag}; skipping scheduled build for ${upstream_ref}"
                continue
              fi
            fi

            matrix="$(jq -c --argjson item "$item" '.include += [$item]' <<< "$matrix")"
          done < <(jq -c '.include[]' <<< "$selected_matrix")

          work_count="$(jq '.include | length' <<< "$matrix")"
          if [ "$work_count" -eq 0 ]; then
            echo "No new upstream PG17 releases need building for the scheduled run."
            has_work=false
          else
            echo "Releases to build:"
            jq -r '.include[] | "- \(.flavor): \(.upstream_ref) (\(.release_name))"' <<< "$matrix"
            has_work=true
          fi

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "has_work=${has_work}" >> "$GITHUB_OUTPUT"

  no_changes:
    name: No new upstream releases
    needs: discover
    if: ${{ needs.discover.outputs.has_work != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report no-op
        run: |
          echo "No new stable Supabase PG17 releases require a build."

  build:
    name: Build ${{ matrix.release.flavor }} ${{ matrix.arch }} from ${{ matrix.release.upstream_ref }}
    needs: discover
    if: ${{ needs.discover.outputs.has_work == 'true' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.discover.outputs.matrix).include }}
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: .workflow

      - name: Checkout upstream release
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: supabase/postgres
          ref: ${{ matrix.release.upstream_ref }}
          path: upstream

      - name: Apply custom extension changes onto upstream release
        run: |
          set -euo pipefail

          upstream_sha="$(git -C upstream rev-parse HEAD)"
          echo "::notice title=Upstream release::${{ matrix.release.upstream_ref }} -> ${upstream_sha}"

          patch_paths=(
            Dockerfile-17
            Dockerfile-multigres
            Dockerfile-orioledb-17
            ansible/files/pgbackrest_config/repo1_encrypted.conf
            ansible/tasks/stage2-setup-postgres.yml
            docker/pgbackrest/pgbackrest-wrapper.sh
            docker/pgctld/orioledb-postgresql.conf.tmpl
            docker/pgctld/postgresql.conf.tmpl
            nix/checks.nix
            nix/ext/pg_duckdb.nix
            nix/ext/pg_durable.nix
            nix/packages/docker-image-test.nix
            nix/packages/default.nix
            nix/packages/postgres.nix
            nix/tests/expected/z_17_ext_interface.out
            nix/tests/expected/z_multigres-17_ext_interface.out
            nix/tests/expected/z_multigres-orioledb-17_ext_interface.out
            nix/tests/expected/z_orioledb-17_ext_interface.out
            nix/tests/sql/z_17_ext_interface.sql
            nix/tests/sql/z_multigres-17_ext_interface.sql
            nix/tests/sql/z_multigres-orioledb-17_ext_interface.sql
            nix/tests/sql/z_orioledb-17_ext_interface.sql
            nix/tools/run-server.sh.in
          )

          git -C .workflow fetch --no-tags --depth=1 \
            https://github.com/supabase/postgres.git \
            "refs/tags/${{ matrix.release.upstream_ref }}:refs/tags/${{ matrix.release.upstream_ref }}"

          git -C .workflow diff --binary "${{ matrix.release.upstream_ref }}" HEAD -- "${patch_paths[@]}" > custom_extensions.patch

          if [ ! -s custom_extensions.patch ]; then
            echo "No custom extension patch was generated. Current branch may not contain extension changes." >&2
            exit 1
          fi

          git -C upstream apply --3way ../custom_extensions.patch
          git -C upstream diff --check

          test -f upstream/docker/pgbackrest/pgbackrest-wrapper.sh
          test -f upstream/nix/ext/pg_durable.nix
          test -f upstream/nix/ext/pg_duckdb.nix
          grep -R 'version = "2.58.0"' upstream/nix/packages/default.nix
          grep -R "pg_durable\\|pg_duckdb" upstream/nix/packages/postgres.nix upstream/nix/ext/pg_durable.nix upstream/nix/ext/pg_duckdb.nix
          if [ "${{ matrix.release.flavor }}" = "orioledb-17" ]; then
            if grep -R "orioledb, pg_duckdb" \
              upstream/Dockerfile-orioledb-17 \
              upstream/Dockerfile-multigres \
              upstream/docker/pgctld/orioledb-postgresql.conf.tmpl \
              upstream/nix/tools/run-server.sh.in \
              upstream/ansible/tasks/stage2-setup-postgres.yml; then
              echo "pg_duckdb must not be preloaded in OrioleDB17 builds until pg_duckdb supports OrioleDB TableAmRoutine ABI." >&2
              exit 1
            fi
          fi

      - name: Install Nix
        uses: ./.workflow/.github/actions/nix-install-ephemeral

      - name: Build Nix package
        working-directory: upstream
        run: |
          set -uo pipefail

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          transient_re='HTTP error 5[0-9][0-9]|error: unable to download|Failed to open archive|Connection (reset|refused|timed out)|Couldn'\''t resolve host|Could not resolve host|unexpected end[- ]of[- ]file|SSL connection|TLS connection|Resource temporarily unavailable|Temporary failure in name resolution'

          delay=30
          for attempt in 1 2 3; do
            echo "::group::nix build attempt ${attempt}/3: ${{ matrix.release.package_attr }} on ${{ matrix.arch }}"
            nix build --accept-flake-config -L "${{ matrix.release.package_attr }}" 2>&1 | tee "$log_file"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"

            if [ "$rc" -eq 0 ]; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit "$rc"
            fi

            if grep -qE "$transient_re" "$log_file"; then
              sleep "$delay"
              delay=$((delay * 2))
            else
              exit "$rc"
            fi
          done

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_docker }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_docker }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image for ${{ matrix.arch }}
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_docker }}
        working-directory: upstream
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail
          target_arg=()
          if [ -n "${{ matrix.release.docker_target }}" ]; then
            target_arg=(--target "${{ matrix.release.docker_target }}")
          fi

          image_repo="${DOCKERHUB_REPOSITORY:-${DOCKER_USERNAME}/postgres}"
          release_tag="${{ matrix.release.upstream_ref }}"
          release_tag="${release_tag#v}"
          version_tag="${release_tag}"
          floating_tag="${{ matrix.release.flavor }}"
          arch_tag="${{ matrix.arch }}"

          echo "Pushing Docker image:"
          echo "  ${image_repo}:${version_tag}-${arch_tag}"
          echo "  ${image_repo}:${floating_tag}-${arch_tag}"

          docker buildx build \
            --platform "linux/${arch_tag}" \
            -f "${{ matrix.release.dockerfile }}" \
            "${target_arg[@]}" \
            -t "${image_repo}:${version_tag}-${arch_tag}" \
            -t "${image_repo}:${floating_tag}-${arch_tag}" \
            --cache-from "type=gha,scope=postgres-${{ matrix.release.flavor }}-${arch_tag}" \
            --cache-to "type=gha,mode=max,scope=postgres-${{ matrix.release.flavor }}-${arch_tag}" \
            --push \
            .

  merge_manifest:
    name: Publish manifest ${{ matrix.release.flavor }} from ${{ matrix.release.upstream_ref }}
    needs:
      - discover
      - build
    if: ${{ needs.discover.outputs.has_work == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_docker) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.discover.outputs.matrix).include }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Merge architecture images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail

          image_repo="${DOCKERHUB_REPOSITORY:-${DOCKER_USERNAME}/postgres}"
          release_tag="${{ matrix.release.upstream_ref }}"
          release_tag="${release_tag#v}"
          version_tag="${release_tag}"
          floating_tag="${{ matrix.release.flavor }}"

          echo "Publishing Docker manifests:"
          echo "  ${image_repo}:${version_tag}"
          echo "  ${image_repo}:${floating_tag}"

          docker buildx imagetools create \
            -t "${image_repo}:${version_tag}" \
            -t "${image_repo}:${floating_tag}" \
            "${image_repo}:${version_tag}-amd64" \
            "${image_repo}:${version_tag}-arm64"

  release:
    name: Publish GitHub release ${{ matrix.release.flavor }}
    needs:
      - discover
      - merge_manifest
    if: ${{ needs.discover.outputs.has_work == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_docker) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.discover.outputs.matrix).include }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: .workflow

      - name: Checkout upstream release
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: supabase/postgres
          ref: ${{ matrix.release.upstream_ref }}
          path: upstream

      - name: Create patched source tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream_sha="$(git -C upstream rev-parse HEAD)"
          release_tag="${{ matrix.release.upstream_ref }}"
          version_tag="${release_tag#v}"
          source_tag="postgres-${version_tag}"

          patch_paths=(
            Dockerfile-17
            Dockerfile-multigres
            Dockerfile-orioledb-17
            ansible/files/pgbackrest_config/repo1_encrypted.conf
            ansible/tasks/stage2-setup-postgres.yml
            docker/pgbackrest/pgbackrest-wrapper.sh
            docker/pgctld/orioledb-postgresql.conf.tmpl
            docker/pgctld/postgresql.conf.tmpl
            nix/checks.nix
            nix/ext/pg_duckdb.nix
            nix/ext/pg_durable.nix
            nix/packages/docker-image-test.nix
            nix/packages/default.nix
            nix/packages/postgres.nix
            nix/tests/expected/z_17_ext_interface.out
            nix/tests/expected/z_multigres-17_ext_interface.out
            nix/tests/expected/z_multigres-orioledb-17_ext_interface.out
            nix/tests/expected/z_orioledb-17_ext_interface.out
            nix/tests/sql/z_17_ext_interface.sql
            nix/tests/sql/z_multigres-17_ext_interface.sql
            nix/tests/sql/z_multigres-orioledb-17_ext_interface.sql
            nix/tests/sql/z_orioledb-17_ext_interface.sql
            nix/tools/run-server.sh.in
          )

          git -C .workflow fetch --no-tags --depth=1 \
            https://github.com/supabase/postgres.git \
            "refs/tags/${{ matrix.release.upstream_ref }}:refs/tags/${{ matrix.release.upstream_ref }}"

          git -C .workflow diff --binary "${{ matrix.release.upstream_ref }}" HEAD -- "${patch_paths[@]}" > custom_extensions.patch

          if [ ! -s custom_extensions.patch ]; then
            echo "No custom extension patch was generated. Current branch may not contain extension changes." >&2
            exit 1
          fi

          git -C upstream apply --3way ../custom_extensions.patch
          git -C upstream diff --check

          test -f upstream/docker/pgbackrest/pgbackrest-wrapper.sh
          grep -R 'version = "2.58.0"' upstream/nix/packages/default.nix

          # GITHUB_TOKEN cannot push a new ref that introduces workflow changes.
          # Keep the release snapshot's workflows identical to this already-trusted
          # fork commit, and make that commit the parent of the source snapshot.
          rm -rf upstream/.github/workflows
          cp -a .workflow/.github/workflows upstream/.github/workflows

          git -C upstream config user.name "github-actions[bot]"
          git -C upstream config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C upstream add -A
          git -C upstream fetch --no-tags --update-shallow ../.workflow "$GITHUB_SHA"

          source_tree="$(git -C upstream write-tree)"
          source_sha="$(git -C upstream commit-tree "$source_tree" \
            -p "$GITHUB_SHA" \
            -m "Apply custom extension changes to ${{ matrix.release.upstream_ref }}" \
            -m "Upstream: supabase/postgres@${upstream_sha}" \
            -m "Extension source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}")"

          if ! git -C upstream diff --quiet "$GITHUB_SHA" "$source_sha" -- .github/workflows; then
            echo "Source snapshot unexpectedly changes .github/workflows" >&2
            git -C upstream diff --stat "$GITHUB_SHA" "$source_sha" -- .github/workflows >&2
            exit 1
          fi

          git -C upstream tag -f "$source_tag" "$source_sha"
          git -C upstream push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "+refs/tags/${source_tag}:refs/tags/${source_tag}"

          {
            echo "source_sha=${source_sha}"
            echo "source_tag=${source_tag}"
            echo "upstream_sha=${upstream_sha}"
            echo "version_tag=${version_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release notes
        id: notes
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail

          image_repo="${DOCKERHUB_REPOSITORY:-${DOCKER_USERNAME}/postgres}"
          version_tag="${{ steps.source.outputs.version_tag }}"
          floating_tag="${{ matrix.release.flavor }}"

          {
            echo "PostgreSQL build based on Supabase upstream release \`${{ matrix.release.upstream_ref }}\`."
            echo
            echo "This release tag points to a commit created by applying the extension patch onto the upstream release source tree."
            echo
            echo "## Source"
            echo
            echo "- Upstream release: \`${{ matrix.release.upstream_ref }}\` (${{ matrix.release.release_name }})"
            echo "- Upstream commit: \`${{ steps.source.outputs.upstream_sha }}\`"
            echo "- Patched source commit: \`${{ steps.source.outputs.source_sha }}\`"
            echo "- Source tag: \`${{ steps.source.outputs.source_tag }}\`"
            echo
            echo "## Docker image"
            echo
            echo "- Docker Hub image: https://hub.docker.com/r/${image_repo}/tags?name=${version_tag}"
            echo "- Version pull: \`docker pull ${image_repo}:${version_tag}\`"
            echo "- Floating Docker Hub image: https://hub.docker.com/r/${image_repo}/tags?name=${floating_tag}"
            echo "- Floating pull: \`docker pull ${image_repo}:${floating_tag}\`"
            echo
            echo "## Architecture tags"
            echo
            echo "- \`${image_repo}:${version_tag}-amd64\`"
            echo "- \`${image_repo}:${version_tag}-arm64\`"
          } > release-notes.md

          title="PostgreSQL ${{ matrix.release.flavor }} ${version_tag}"
          {
            echo "release_tag=${{ steps.source.outputs.source_tag }}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.notes.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest=false
          fi
